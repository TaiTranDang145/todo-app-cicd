name: CI Pipeline

# Workflow được kích hoạt khi push/PR vào main, hoặc khi tạo Git Tag mới dạng v1.0.0
on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Chạy bộ kiểm thử tự động (Unit Tests)
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Kéo mã nguồn từ repo GitHub về máy ảo của Runner
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Bước 2: Thiết lập môi trường Python 3.10
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Tự động cache các thư viện pip để giảm thời gian cài đặt ở các lần chạy sau

      # Bước 3: Cài đặt các thư viện cần thiết cho FastAPI backend và cho bộ test pytest
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      # Bước 4: Khởi chạy pytest để kiểm tra độ chính xác của API
      - name: Run Unit Test
        run: |
          pytest backend/

  # Job 2: Biên dịch các Docker images và đẩy lên GHCR (Chỉ chạy khi tạo Tag dạng v1.0.0)
  build-and-push:
    name: Build & Push Docker Images
    needs: test # Job này chỉ chạy khi Job 'test' trước đó kết thúc thành công
    runs-on: ubuntu-latest
    # CHỈ build và push khi sự kiện là push một TAG mới (ví dụ: v1.0.0)
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      # Bước 1: Kéo mã nguồn từ GitHub về Runner
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Bước 1.5: Chuyển tên tài khoản GitHub (owner) sang dạng chữ thường để làm tag Docker hợp lệ
      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      # Bước 2: Đăng nhập vào GitHub Container Registry (GHCR) sử dụng token mặc định
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Bước 3: Build và đẩy Docker Image của Backend lên GHCR
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/todo-backend:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER_LC }}/todo-backend:latest

      # Bước 4: Build và đẩy Docker Image của Frontend lên GHCR
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          # Truyền API URL động trỏ đến IP máy chủ Production cổng 8005
          build-args: |
            VITE_API_URL=http://${{ secrets.HOST }}:8005
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/todo-frontend:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER_LC }}/todo-frontend:latest

      # Bước 5: Tự động tạo Release và Changelog trên GitHub
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
