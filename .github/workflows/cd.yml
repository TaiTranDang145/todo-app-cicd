name: CD

# Kích hoạt tự động sau khi workflow CI hoàn thành
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    # Chỉ deploy nếu kết quả của CI workflow trước đó thành công
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # Bước 1: Kéo mã nguồn từ GitHub về Runner (để lấy file docker-compose.yml mới nhất)
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Bước 2: Tự động tạo thư mục test trong home directory của VPS nếu chưa tồn tại
      - name: Pre-create deployment folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            mkdir -p /home/${{ secrets.USERNAME }}/test

      # Bước 3: TỰ ĐỘNG COPY file docker-compose.yml mới nhất từ GitHub sang thư mục test trên VPS
      - name: Copy docker-compose.yml via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "docker-compose.yml"
          target: "/home/${{ secrets.USERNAME }}/test"
          strip_components: 0

      # Bước 4: Thực thi kéo image mới và khởi động lại các Container trên VPS
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/${{ secrets.USERNAME }}/test

            # Lấy Commit SHA từ workflow CI vừa hoàn tất thành công
            export COMMIT_SHA=${{ github.event.workflow_run.head_sha }}
            echo "Bắt đầu cập nhật hệ thống sang phiên bản: $COMMIT_SHA"

            # Tạo/Cập nhật file .env để docker-compose.yml đọc các biến môi trường
            echo "TAG=$COMMIT_SHA" > .env
            echo "VITE_API_URL=http://${{ secrets.HOST }}:8000" >> .env
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env

            # Kéo các Docker Images có tag Commit SHA tương ứng về máy chủ VPS
            docker compose pull

            # Cập nhật và khởi động lại các Container dưới dạng background mode
            docker compose up -d --remove-orphans

            # Dọn dẹp dung lượng đĩa cứng máy chủ
            docker image prune -f

            echo "Triển khai CD thành công!"
